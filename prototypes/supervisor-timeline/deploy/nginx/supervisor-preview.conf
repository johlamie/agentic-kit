server {
    listen 80;
    listen [::]:80;
    server_name supervisor-preview.164.132.106.135.sslip.io;

    root /home/ubuntu/agentic-kit/prototypes/supervisor-timeline;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /styles.css { try_files /styles.css =404; }
    location = /app.js { try_files /app.js =404; }
    location = /favicon.svg { try_files /favicon.svg =404; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Every project slug renders the isolated SPA. No repository file other
    # than the three public assets above can be served directly.
    location = / { try_files /index.html =404; }
    location ~ "^/[a-zA-Z0-9_-]{1,64}/?$" { try_files /index.html =404; }
    location / { return 404; }
}
