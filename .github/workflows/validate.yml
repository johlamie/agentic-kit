name: Validate agentic kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  claude-native-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Install Claude Code with the official native installer
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Verify the native binary
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v claude
          claude --version

  offline-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Lint shell scripts
        run: shellcheck setup/*.sh scripts/*.sh global/hooks/*.sh supervisor/bin/* supervisor/scripts/*.sh
      - name: Validate manifests and configuration
        run: ./scripts/validate-kit.sh
      - name: Guard hook decision table
        run: ./global/hooks/agent-guard.sh --self-test
      - name: Smoke-test isolated installation
        run: ./scripts/smoke-install.sh

  supervisor-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supervisor/package-lock.json
      - name: Install locked Supervisor dependencies
        working-directory: supervisor
        run: npm ci
      - name: Audit production dependencies
        working-directory: supervisor
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: supervisor
        run: npm run typecheck
      - name: Unit and integration tests with mocked Codex
        working-directory: supervisor
        run: npm test
      - name: Production build
        working-directory: supervisor
        run: npm run build

  kimi-offline-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck kimi/setup/*.sh kimi/scripts/*.sh
      - name: Validate manifests and configuration
        run: ./kimi/scripts/validate-kit.sh
      - name: Smoke-test isolated installation
        run: ./kimi/scripts/smoke-install.sh
