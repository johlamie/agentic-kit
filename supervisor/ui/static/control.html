<!doctype html>
<html lang="fr" data-supervisor-runtime="true">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0d">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="Centre de contrôle local et en lecture seule des missions supervisées par Kriton.">
    <!-- frame-ancestors is ignored in a meta policy and logs a console error;
         the HTTP header from activitySecurityHeaders() enforces it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <title>Centre de contrôle · Kriton Supervisor</title>
    <link rel="icon" href="/_supervisor/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/_supervisor/assets/control.css">
    <script src="/_supervisor/assets/control.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Navigation du centre de contrôle">
        <div class="sidebar__top">
          <a class="brand" href="#/" aria-label="Kriton Supervisor, vue d’ensemble">
            <span class="brand__mark" aria-hidden="true">K</span>
            <span>Kriton Supervisor</span>
          </a>
          <button class="icon-btn sidebar__close" type="button" data-close-nav aria-label="Fermer la navigation">
            <span data-icon="x"></span>
          </button>
        </div>

        <nav aria-label="Groupes d’action">
          <ul class="nav" data-nav-groups>
            <li><a href="#/" data-route="overview"><span data-icon="layout-dashboard"></span>Vue d’ensemble</a></li>
            <li><a href="#/attente" data-route="attente"><span data-icon="inbox"></span>En attente de toi<span class="count count--human" data-count="waiting">—</span></a></li>
            <li><a href="#/bloques" data-route="bloques"><span data-icon="octagon-alert"></span>Bloqués<span class="count count--block" data-count="blocked">—</span></a></li>
            <li><a href="#/runs" data-route="runs"><span data-icon="activity"></span>Runs en cours<span class="count" data-count="runs">—</span></a></li>
            <li><a href="#/missions" data-route="missions"><span data-icon="target"></span>Missions<span class="count" data-count="missions">—</span></a></li>
            <li><a href="#/portes" data-route="portes"><span data-icon="flag"></span>Portes et décisions<span class="count" data-count="gates">—</span></a></li>
            <li><a href="#/audits" data-route="audits"><span data-icon="shield-check"></span>Audits<span class="count count--block" data-count="audits">—</span></a></li>
            <li><a href="#/activite" data-route="activite"><span data-icon="history"></span>Activité</a></li>
          </ul>
        </nav>

        <div class="nav-title">
          <span>Projets</span>
          <a href="#/projets" data-route="projets">Portefeuille</a>
        </div>
        <ul class="nav nav--projects" data-nav-projects>
          <li class="nav-empty">Lecture des projets…</li>
        </ul>

        <dl class="sidebar__foot" aria-label="Santé du Supervisor">
          <div><dt>Daemon</dt><dd data-health="daemon">—</dd></div>
          <div><dt>File</dt><dd data-health="queue">—</dd></div>
          <div><dt>Telegram</dt><dd data-health="telegram">—</dd></div>
        </dl>
      </aside>
      <div class="scrim" data-close-nav hidden></div>

      <div class="workspace">
        <header class="topbar-mobile">
          <button class="icon-btn" type="button" data-open-nav aria-controls="sidebar" aria-expanded="false" aria-label="Ouvrir la navigation">
            <span data-icon="menu"></span>
          </button>
          <a class="brand" href="#/"><span class="brand__mark" aria-hidden="true">K</span><span>Supervisor</span></a>
          <span class="topbar-mobile__badges" data-mobile-badges></span>
        </header>

        <main id="main-content" class="main" tabindex="-1">
          <div class="page" data-page>
            <p class="state-note">Lecture de l’état de la supervision…</p>
          </div>
          <p class="sr-only" aria-live="polite" aria-atomic="true" data-live-summary></p>
        </main>
      </div>
    </div>
  </body>
</html>
