# permissions.toml — Global permissions for the agentic delivery kit (Kimi Code
# edition), translated from the Claude Code kit's global/settings.json.
#
# NOT symlinked: merge these blocks into ~/.kimi-code/config.toml yourself
# (config.toml also holds your API keys, so it is never versioned):
#     cat ~/agentic-kit/kimi/config/permissions.toml >> ~/.kimi-code/config.toml
#
# Goal: the pipeline runs fluidly on routine work, and STOPS on anything
# destructive, costly, or public-facing.
#
# IMPORTANT — semantics differ from Claude Code:
#   - Kimi Code matches [[permission.rules]] IN ORDER: the FIRST matching rule
#     wins. Deny rules are therefore listed BEFORE allow rules (in Claude Code,
#     deny always won over allow regardless of order).
#   - Claude Code's `Bash(cmd:*)` becomes `Bash(cmd*)` here.
#   - Claude Code's WebFetch is FetchURL in Kimi Code. FetchURL is read-only
#     and auto-allowed by the runtime, and per-domain restriction has no
#     documented pattern syntax — the six WebFetch(domain:…) allow rules are
#     replaced by a single plain FetchURL allow below.
#   - MCP tools match by name only (mcp__github__* style argument patterns are
#     not supported), same as Claude Code.
#
# Notes carried over from the original:
#   - deny on git push / certbot / nginx / systemctl / eas submit = these are
#     the G4 gate: the agent proposes the command, you run it or approve it.
#   - deny on ~/.kimi-code/** = the agent cannot silently rewrite its own
#     rules; the retrospective skill proposes diffs, you apply them.
#   - deny on .env / .ssh = secrets never enter the model context.
#   - Adjust as you build trust: the right moment to move a command from deny
#     to allow is after you have approved it manually a dozen times without
#     surprise.

# ============================ DENY (first) ============================

[[permission.rules]]
decision = "deny"
pattern = "Bash(rm -rf*)"

[[permission.rules]]
decision = "deny"
pattern = "Bash(sudo*)"

[[permission.rules]]
decision = "deny"
pattern = "Bash(git push*)"

[[permission.rules]]
