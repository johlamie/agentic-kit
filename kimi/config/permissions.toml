# FetchURL replaces Claude Code's WebFetch; it is read-only and auto-allowed
# by the runtime. Per-domain restriction (docs.anthropic.com, supabase.com,
# firebase.google.com, nextjs.org, docs.expo.dev, github.com) has no documented
# pattern syntax in Kimi Code — allow the tool plainly.
[[permission.rules]]
decision = "allow"
pattern = "FetchURL"

[[permission.rules]]
decision = "allow"
pattern = "mcp__context7"

[[permission.rules]]
decision = "allow"
pattern = "mcp__mobbin"

[[permission.rules]]
decision = "allow"
pattern = "mcp__playwright"
