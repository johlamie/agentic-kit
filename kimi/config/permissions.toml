pattern = "Bash(dropdb*)"

[[permission.rules]]
decision = "deny"
pattern = "Bash(mysql*)"

[[permission.rules]]
decision = "deny"
pattern = "Bash(curl -X POST*)"

[[permission.rules]]
decision = "deny"
pattern = "Read(./.env)"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.ssh/**)"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.aws/**)"

[[permission.rules]]
decision = "deny"
pattern = "Write(~/.kimi-code/AGENTS.md)"

[[permission.rules]]
decision = "deny"
pattern = "Write(~/.kimi-code/skills/**)"

